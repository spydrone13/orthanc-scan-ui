<a class="back-link d-block mb-3" routerLink="/scan-lot">&#8592; Back</a>
<h1 class="card-title fs-4">Start Scanning Session</h1>
<div class="session-context vstack gap-1 mb-1">
  <div class="d-flex align-items-baseline gap-2">
    <span class="session-label fs-7 fw-medium text-body-secondary">Stage</span>
    <span class="session-value">{{ stageService.stageDescription(stage()) }}</span>
  </div>
</div>
<hr class="my-3" />
<form class="form-stack" [formGroup]="sessionForm" (ngSubmit)="onSessionSubmit()" novalidate>
  <div>
    <label class="form-label" for="userName">User Name</label>
    <input
      id="userName"
      type="text"
      class="form-control"
      formControlName="userName"
      placeholder="Enter your name"
      [class.is-invalid]="sessionForm.controls.userName.invalid && sessionForm.controls.userName.touched"
    />
    @if (sessionForm.controls.userName.invalid && sessionForm.controls.userName.touched) {
      <div class="invalid-feedback d-block">User name is required.</div>
    }
  </div>
  <button type="submit" class="btn btn-primary w-100 mt-2">Start Session</button>
</form>
